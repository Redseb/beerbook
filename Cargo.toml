# Beer Book's native workspace: the web and Apple shells exact2 generates (copied from
# .exact/shells, paths from here), and the app's own GPU module, `gpu/`: the beer shader.
[workspace]
members = ["web", "apple", "gpu"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "../exact/vendor/accesskit-windows" }
taffy = { path = "../exact/vendor/taffy" }
parley = { path = "../exact/vendor/parley" }
fontique = { path = "../exact/vendor/fontique" }
wgpu-hal = { path = "../exact/vendor/wgpu-hal" }
